# Explicit opt-in example, not loaded by the shipped tracker configuration.
# Merge this commits unit into the existing distribution catalog or [openruyi.commits] override.
[commits]
interval_seconds = 3600
stale_after_seconds = 86400
batch_size = 32
max_findings = 1000
max_batch_bytes = 4194304

